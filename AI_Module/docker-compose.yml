services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: spacemedx
      POSTGRES_USER: spacemedx
      POSTGRES_PASSWORD: spacemedx
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spacemedx"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
