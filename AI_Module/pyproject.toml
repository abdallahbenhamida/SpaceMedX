[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "spacemedx-processing"
version = "3.2.0"
description = "SpaceMedx deterministic-first processing foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2.5,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
include = ["spacemedx*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
