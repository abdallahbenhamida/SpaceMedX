[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacemedx-backend"
version = "0.0.1"
description = "SpaceMedx Health Monitoring Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "psycopg2-binary>=2.9.9"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
