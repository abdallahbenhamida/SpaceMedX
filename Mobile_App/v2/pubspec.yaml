name: spacemedx
description: "SpaceMedX mobile HUB: one-button health data collection for astronauts."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Material texts and right-to-left layout for every language of the app
  flutter_localizations:
    sdk: flutter

  # key/value storage (server address, user id, settings)
  shared_preferences: 2.5.3
  # HTTP POST to the server
  http: 1.4.0
  sqflite: 2.4.2
  path: 1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
