name: e77hal_plugin
description: >-
  Flutter port of cordova-plugin-e77hal (v4.5.3): Bluetooth LE hardware
  abstraction layer for Beurer BM85, Savvy ECG, Dcont Nemere and Polar H7.
version: 5.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  # BLE transport (BSD-3-Clause). Replaces the generic Bluetooth layer of the
  # Cordova plugin (E77halPlugin.java / E77halPlugin.m).
  flutter_reactive_ble: 5.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  plugin:
    platforms:
      # Small native helper: OS bonding (createBond), enabling Bluetooth,
      # runtime permissions and location settings – things the BLE transport
      # library does not offer.
      android:
        package: com.obuda.biotech.e77hal
        pluginClass: E77halPlugin
